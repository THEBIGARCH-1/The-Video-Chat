<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Video Chat</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 30px;
        }
        .card {
            background: #222;
            padding: 25px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 80%;
            margin-bottom: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #000;
            color: white;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 85%;
        }
        .btn-create { background: #28a745; color: white; }
        .btn-create:hover { background: #218838; }
        .btn-join { background: #007bff; color: white; }
        .btn-join:hover { background: #0069d9; }
        
        #video-container {
            display: none;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .video-box {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
        }
        video {
            width: 400px;
            height: 300px;
            object-fit: cover;
            display: block;
        }
        .label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        #status { margin-top: 15px; color: #ffc107; }
    </style>
</head>
<body>

    <h2>Video Chat Room</h2>

    <div id="lobby" class="card">
        <button class="btn-create" id="create-btn">Create Room</button>
        <p style="margin: 15px 0; color: #888;">OR</p>
        <input type="text" id="room-input" placeholder="Enter Room Code">
        <br>
        <button class="btn-join" id="join-btn">Join Room</button>
        <div id="status"></div>
    </div>

    <div id="room-info" style="display:none; margin-bottom: 15px;">
        Room Code: <strong id="code-display" style="color: #00bcd4; font-size: 20px;"></strong>
    </div>

    <div id="video-container">
        <div class="video-box">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="label">You</div>
        </div>
        <div class="video-box">
            <video id="remote-video" autoplay playsinline></video>
            <div class="label">Friend's Camera</div>
        </div>
    </div>

    <script>
        const lobby = document.getElementById('lobby');
        const roomInfo = document.getElementById('room-info');
        const codeDisplay = document.getElementById('code-display');
        const createBtn = document.getElementById('create-btn');
        const joinBtn = document.getElementById('join-btn');
        const roomInput = document.getElementById('room-input');
        const statusDiv = document.getElementById('status');
        const videoContainer = document.getElementById('video-container');
        
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');

        let localStream;
        let peer;

        // Request local camera and microphone access right away
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
            })
            .catch(err => {
                statusDiv.innerText = "Error: Camera/Microphone access denied or not supported.";
                console.error(err);
            });

        function makeCode() {
            return Math.random().toString(36).substring(2, 7).toUpperCase();
        }

        createBtn.addEventListener('click', () => {
            if (!localStream) return alert("Please allow camera access first!");
            const code = makeCode();
            startChat(code, true);
        });

        joinBtn.addEventListener('click', () => {
            if (!localStream) return alert("Please allow camera access first!");
            const code = roomInput.value.trim().toUpperCase();
            if (!code) return alert("Please type a room code!");
            startChat(code, false);
        });

        function startChat(roomCode, isCreator) {
            lobby.style.display = 'none';
            roomInfo.style.display = 'block';
            codeDisplay.innerText = roomCode;
            videoContainer.style.display = 'flex';

            const peerId = `camchat-${roomCode}-${isCreator ? 'host' : 'guest'}`;
            peer = new Peer(peerId);

            peer.on('open', () => {
                if (!isCreator) {
                    statusDiv.innerText = "Connecting to room...";
                    const hostId = `camchat-${roomCode}-host`;
                    const call = peer.call(hostId, localStream);
                    
                    call.on('stream', remoteStream => {
                        remoteVideo.srcObject = remoteStream;
                        statusDiv.innerText = "Connected!";
                    });
                } else {
                    statusDiv.innerText = "Waiting for someone to join your room...";
                }
            });

            // If someone joins and calls this client, answer with local camera stream
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                    statusDiv.innerText = "Connected!";
                });
            });

            peer.on('error', err => {
                if (err.type === 'unavailable-id') {
                    alert("This room code is already taken. Try a different one!");
                    location.reload();
                } else {
                    console.error(err);
                }
            });
        }
    </script>
</body>
</html>
