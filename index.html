<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Room Video Chat</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        input {
            padding: 12px;
            font-size: 16px;
            width: 80%;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            text-align: center;
            outline: none;
            text-transform: uppercase;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            margin: 5px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 85%;
        }
        .btn-create { background: #10b981; color: white; }
        .btn-create:hover { background: #059669; }
        .btn-join { background: #0284c7; color: white; }
        .btn-join:hover { background: #0369a1; }
        
        #video-container {
            display: none;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .video-box {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #334155;
            width: 400px;
            height: 300px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #cbd5e1;
        }
        #status { margin-top: 15px; color: #fbbf24; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

    <h2>Direct Connect Video Chat</h2>

    <div id="lobby" class="card">
        <button class="btn-create" id="create-btn">Create Room</button>
        <p style="margin: 15px 0; color: #94a3b8;">OR</p>
        <input type="text" id="room-input" placeholder="Enter Room Code">
        <br>
        <button class="btn-join" id="join-btn">Join Room</button>
        <div id="status"></div>
    </div>

    <div id="room-info" style="display:none; margin-bottom: 15px;">
        Room Code: <strong id="code-display" style="color: #38bdf8; font-size: 20px;"></strong>
    </div>

    <div id="video-container">
        <div class="video-box">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="label">You</div>
        </div>
        <div class="video-box">
            <video id="remote-video" autoplay playsinline></video>
            <div class="label">Friend</div>
        </div>
    </div>

    <script>
        const lobby = document.getElementById('lobby');
        const roomInfo = document.getElementById('room-info');
        const codeDisplay = document.getElementById('code-display');
        const createBtn = document.getElementById('create-btn');
        const joinBtn = document.getElementById('join-btn');
        const roomInput = document.getElementById('room-input');
        const statusDiv = document.getElementById('status');
        const videoContainer = document.getElementById('video-container');
        
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');

        let localStream;
        let peer;

        // 1. Request webcam and mic permissions immediately on load
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
            })
            .catch(err => {
                statusDiv.innerText = "Error: Camera/Microphone access blocked.";
                console.error(err);
            });

        function makeCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // Button: Create Room (You become the Host)
        createBtn.addEventListener('click', () => {
            if (!localStream) return alert("Please allow camera permissions first!");
            const code = makeCode();
            startHost(code);
        });

        // Button: Join Room (You connect directly to the Host's code)
        joinBtn.addEventListener('click', () => {
            if (!localStream) return alert("Please allow camera permissions first!");
            const code = roomInput.value.trim().toUpperCase();
            if (!code) return alert("Please type a room code!");
            startGuest(code);
        });

        // HOST SETUP
        function startHost(roomCode) {
            lobby.style.display = 'none';
            roomInfo.style.display = 'block';
            codeDisplay.innerText = roomCode;
            videoContainer.style.display = 'flex';
            statusDiv.innerText = "Waiting for your friend to join...";

            // Create a completely predictable ID for the host using the room code
            const hostPeerId = `directchat-host-${roomCode}`;
            peer = new Peer(hostPeerId);

            peer.on('open', () => {
                console.log("Host ready with ID:", hostPeerId);
            });

            // When the guest dials in, answer with your local stream
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                    statusDiv.innerText = "Connected!";
                });
            });

            peer.on('error', err => {
                if (err.type === 'unavailable-id') {
                    alert("This room code is already active. Try a different code or refresh!");
                    location.reload();
                } else {
                    console.error(err);
                }
            });
        }

        // GUEST SETUP
        function startGuest(roomCode) {
            lobby.style.display = 'none';
            roomInfo.style.display = 'block';
            codeDisplay.innerText = roomCode;
            videoContainer.style.display = 'flex';
            statusDiv.innerText = "Connecting to room...";

            // Give the guest a random temporary ID so it doesn't clash
            peer = new Peer();

            peer.on('open', () => {
                // Target the exact host ID created by your friend
                const hostPeerId = `directchat-host-${roomCode}`;
                
                // Call the host directly using your local stream
                const call = peer.call(hostPeerId, localStream);

                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                    statusDiv.innerText = "Connected!";
                });

                call.on('error', (err) => {
                    alert("Could not find that room code. Make sure your friend created the room first!");
                    location.reload();
                });
            });

            peer.on('error', err => {
                console.error(err);
            });
        }
    </script>
</body>
</html>
