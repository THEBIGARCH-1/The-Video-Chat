<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Multiplayer Arena</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #222;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin-top: 10px;
            border-radius: 8px;
        }
        .instructions {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h2>Online Multiplayer Arena</h2>
    <p class="instructions">Use the <b>Arrow Keys</b> or <b>W, A, S, D</b> to move your player around!</p>
    
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Local player position & properties
        let player = {
            x: Math.random() * 550 + 25,
            y: Math.random() * 350 + 25,
            size: 20,
            speed: 4,
            color: '#' + Math.floor(Math.random()*16777215).toString(16) // Random color
        };

        // Track pressed keys
        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // Connect to a public multiplayer broadcast server or test locally via WebSocket simulation
        // For a true zero-config public test, you can plug in a public WebSocket echo/relay endpoint
        // Or run a local Node.js WebSocket script. Here is the canvas loop engine setup:

        function update() {
            // Movement logic
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > player.size) player.y -= player.speed;
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < canvas.height - player.size) player.y += player.speed;
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > player.size) player.x -= player.speed;
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.size) player.x += player.speed;
        }

        function draw() {
            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines for visual style
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath();
                ctx.moveTo(0, j);
                ctx.lineTo(canvas.width, j);
                ctx.stroke();
            }

            // Draw local player
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            // Draw player core label
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.fillText('You', player.x - 11, player.y - 25);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
