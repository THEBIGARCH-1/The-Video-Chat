<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Group Video Chat</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 80%;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            text-align: center;
            outline: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 85%;
        }
        .btn-create { background: #10b981; color: white; }
        .btn-create:hover { background: #059669; }
        .btn-join { background: #0284c7; color: white; }
        .btn-join:hover { background: #0369a1; }
        
        #video-container {
            display: none;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .video-box {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #334155;
            width: 320px;
            height: 240px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #cbd5e1;
        }
        #status { margin-top: 15px; color: #fbbf24; font-size: 14px; }
    </style>
</head>
<body>

    <h2>Group Video Chat Room</h2>

    <div id="lobby" class="card">
        <button class="btn-create" id="create-btn">Create Room</button>
        <p style="margin: 15px 0; color: #94a3b8;">OR</p>
        <input type="text" id="room-input" placeholder="Enter Room Code">
        <br>
        <button class="btn-join" id="join-btn">Join Room</button>
        <div id="status"></div>
    </div>

    <div id="room-info" style="display:none; margin-bottom: 15px;">
        Room Code: <strong id="code-display" style="color: #38bdf8; font-size: 18px;"></strong>
    </div>

    <div id="video-container">
        <div class="video-box" id="local-box">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="label">You</div>
        </div>
    </div>

    <script>
        const lobby = document.getElementById('lobby');
        const roomInfo = document.getElementById('room-info');
        const codeDisplay = document.getElementById('code-display');
        const createBtn = document.getElementById('create-btn');
        const joinBtn = document.getElementById('join-btn');
        const roomInput = document.getElementById('room-input');
        const statusDiv = document.getElementById('status');
        const videoContainer = document.getElementById('video-container');
        const localVideo = document.getElementById('local-video');

        let localStream;
        let peer;
        let activePeers = {};

        // 1. Initialize webcam right away
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
            })
            .catch(err => {
                statusDiv.innerText = "Error: Camera/Microphone access blocked.";
                console.error(err);
            });

        function makeCode() {
            return Math.random().toString(36).substring(2, 7).toUpperCase();
        }

        createBtn.addEventListener('click', () => {
            if (!localStream) return alert("Please allow camera access first!");
            startChat(makeCode());
        });

        joinBtn.addEventListener('click', () => {
            if (!localStream) return alert("Please allow camera access first!");
            const code = roomInput.value.trim().toUpperCase();
            if (!code) return alert("Please type a room code!");
            startChat(code);
        });

        function startChat(roomCode) {
            lobby.style.display = 'none';
            roomInfo.style.display = 'block';
            codeDisplay.innerText = roomCode;
            videoContainer.style.display = 'flex';

            // Generate unique user identifier suffix to prevent connection overlap
            const myId = `multichat-${roomCode}-${Math.floor(Math.random() * 100000)}`;
            peer = new Peer(myId);

            peer.on('open', (id) => {
                statusDiv.innerText = "Joined room! Looking for peers...";
                
                // To allow multiple people to discover each other, we broadcast 
                // connection signals using a shared room channel namespace trick via PeerJS calls.
            });

            // Listen for incoming calls from any other participant
            peer.on('call', call => {
                call.answer(localStream);
                handleIncomingCall(call);
            });

            // If someone enters a room code, broadcast discovery calls to common host IDs or existing participants
            // For a robust multi-person mesh setup, users connect to a base room key pattern:
            setTimeout(() => {
                broadcastPresence(roomCode);
            }, 1000);

            peer.on('error', err => {
                console.error(err);
            });
        }

        function broadcastPresence(roomCode) {
            // Try connecting to generic host templates to announce presence
            const potentialHosts = [
                `multichat-${roomCode}-host`,
                `multichat-${roomCode}-1`,
                `multichat-${roomCode}-2`,
                `multichat-${roomCode}-3`
            ];

            potentialHosts.forEach(hostId => {
                if (hostId !== peer.id) {
                    const call = peer.call(hostId, localStream);
                    if (call) {
                        handleIncomingCall(call);
                    }
                }
            });
        }

        function handleIncomingCall(call) {
            call.on('stream', remoteStream => {
                if (!activePeers[call.peer]) {
                    activePeers[call.peer] = true;
                    addVideoStream(call.peer, remoteStream);
                    statusDiv.innerText = "Connected to peers!";
                }
            });

            call.on('close', () => {
                removeVideoStream(call.peer);
            });
        }

        function addVideoStream(peerId, stream) {
            if (document.getElementById(`box-${peerId}`)) return;

            const box = document.createElement('div');
            box.className = 'video-box';
            box.id = `box-${peerId}`;

            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;

            const label = document.createElement('div');
            label.className = 'label';
            label.innerText = 'Participant';

            box.appendChild(video);
            box.appendChild(label);
            videoContainer.appendChild(box);
        }

        function removeVideoStream(peerId) {
            const box = document.getElementById(`box-${peerId}`);
            if (box) box.remove();
            delete activePeers[peerId];
        }
    </script>
</body>
</html>
