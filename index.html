<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Room Video Chat</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
            margin: 0;
            padding: 20px;
        }
        #setup-box {
            margin: 20px 0;
            background: #333;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
        }
        #video-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        video {
            width: 400px;
            height: 300px;
            background: black;
            border-radius: 8px;
            object-fit: cover;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #0084ff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #006fe6;
        }
        #room-link {
            word-break: break-all;
            color: #4da6ff;
        }
    </style>
</head>
<body>

    <h2>Quick Room Video Chat</h2>

    <div id="setup-box">
        <div id="join-view">
            <p>Enter a short room code to join:</p>
            <input type="text" id="room-input" placeholder="e.g. cool-chat-123">
            <button id="join-btn">Join Room</button>
        </div>
        <div id="room-view" style="display: none;">
            <p>Current Room Code: <strong id="room-display" style="color: #4da6ff;"></strong></p>
            <p>Share this link with your friend:</p>
            <p id="room-link"></p>
        </div>
    </div>

    <div id="video-container">
        <video id="local-video" autoplay muted></video>
        <video id="remote-video" autoplay></video>
    </div>

    <script>
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const roomInput = document.getElementById('room-input');
        const joinBtn = document.getElementById('join-btn');
        const joinView = document.getElementById('join-view');
        const roomView = document.getElementById('room-view');
        const roomDisplay = document.getElementById('room-display');
        const roomLink = document.getElementById('room-link');

        let localStream;
        let peer;
        let currentCall;

        // Get local webcam and microphone stream immediately
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
            })
            .catch(error => console.error('Error accessing media devices.', error));

        // Check if user opened a link with a room code already included
        const urlParams = new URLSearchParams(window.location.search);
        const existingRoom = urlParams.get('room');
        if (existingRoom) {
            roomInput.value = existingRoom;
            startConnection(existingRoom);
        }

        joinBtn.addEventListener('click', () => {
            const roomCode = roomInput.value.trim();
            if (!roomCode) return alert('Please enter a room code');
            
            // Update URL so the link can be shared easily
            const newUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            window.history.pushState({path: newUrl}, '', newUrl);

            startConnection(roomCode);
        });

        function startConnection(roomCode) {
            joinView.style.display = 'none';
            roomView.style.display = 'block';
            roomDisplay.innerText = roomCode;
            roomLink.innerText = window.location.href;

            // Use a deterministic ID prefix based on the room code via PeerJS
            // We append a suffix so two people can join the same room name
            peer = new Peer('zoom-clone-' + roomCode + '-' + Math.floor(Math.random() * 1000));

            peer.on('open', id => {
                // Look for other peers in the same room namespace by trying to call them
                // Or wait for an incoming call if someone is already there
                console.log('Connected to network with ID:', id);
            });

            // If someone else joins the room and calls you
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                });
                currentCall = call;
            });

            // Automatically try connecting to other users in the same room after a short delay
            setTimeout(() => {
                connectToRoomPeers(roomCode);
            }, 1000);
        }

        function connectToRoomPeers(roomCode) {
            // PeerJS doesn't natively list room occupants without a backend, 
            // so we can attempt a clever trick: call a peer with a random suffix 
            // or use a helper identifier. Alternatively, if you want guaranteed instant 
            // multi-user routing without manual IDs, both users can just click join 
            // and call a target ID pattern.
        }
    </script>
</body>
</html>
